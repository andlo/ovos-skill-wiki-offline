# Build the wheel and run the tests on every push; publish it to PyPI when a
# version tag is pushed (vX.Y.Z, matching `version` in pyproject.toml).
# Publishing uses PyPI's trusted publishing (no token): the PyPI project must
# name this repo, this workflow and the "pypi" environment as its publisher.
name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -q -e ".[test]"
          pytest -q tests
      - name: Build
        run: |
          pip install -q build
          python -m build
      - name: Pure Python, entry point present
        run: |
          ls dist/*-py3-none-any.whl
          unzip -p dist/*.whl '*.dist-info/entry_points.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A GitHub release for the tag, with the wheel and sdist attached and the
  # commits since the previous tag as release notes. Alpha/beta/rc tags
  # (v0.1.0a2) become pre-releases. Klondike only lists a skill or plugin as
  # "Looks Complete" when it has both a PyPI release and a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          ver="${TAG#v}"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## What's new since $prev"; echo
              git log --no-merges --reverse --format='- %s' "$prev..$TAG"
            else
              echo "## First release"; echo
              git log --no-merges --reverse --format='- %s' "$TAG"
            fi | grep -vE '^- v?[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'
            echo; echo "## Install"; echo
            echo '```'; echo "pip install $pkg==$ver"; echo '```'; echo
            echo -n "[PyPI](https://pypi.org/project/$pkg/$ver/)"
            [ -n "$prev" ] && echo -n " · [Full changelog](https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG)"
            echo
          } > notes.md
          pre=""
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then pre="--prerelease"; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --verify-tag $pre
