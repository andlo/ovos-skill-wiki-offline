[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-wiki-offline"
version = "0.2.0"
description = "Offline general-knowledge lookup covering Wikipedia's ~10,000 Level 4 Vital Articles. English, Spanish, and French are native; any other language is answered via on-demand offline translation. No internet connection needed."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "voice", "assistant", "offline", "wikipedia", "encyclopedia", "common", "query", "fallback", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-workshop>=0.0.15,<10.0.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-wiki-offline"
Issues = "https://github.com/emkay-voice/ovos-skill-wiki-offline/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-wiki-offline/main/icon.png"

[project.entry-points."opm.skill"]
"ovos-skill-wiki-offline.emkay-voice" = "ovos_skill_wiki_offline:WikiOffline"

[tool.setuptools]
packages = ["ovos_skill_wiki_offline"]

[tool.setuptools.package-dir]
ovos_skill_wiki_offline = ""

[tool.setuptools.package-data]
ovos_skill_wiki_offline = ["locale/**/*", "data/**/*", "*.png"]
